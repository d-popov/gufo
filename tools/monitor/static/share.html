<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Chat</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/header.css">
  <link rel="stylesheet" href="/static/chat.css">
  <link rel="stylesheet" href="/static/share.css">
  <script src="/static/icons.js" defer></script>
  <script src="/static/markdown.js" defer></script>
  <script src="/static/language.js" defer></script>
  <script src="/static/avatar.js" defer></script>
  <script src="/static/talk.js" defer></script>
  <script src="/static/librarytools.js" defer></script>
  <script src="/static/webtools.js" defer></script>
  <script src="/static/pybox.js" defer></script>
  <script src="/static/tools.js" defer></script>
  <script src="/static/messageview.js" defer></script>
  <script src="/static/share.js" defer></script>
</head>
<body>
  <main class="chat share">
    <div class="toolbar">
      <strong id="share-title">Chat</strong>
      <span id="share-left" class="muted"></span>
      <label class="muted name">You are <input id="share-name" type="text" maxlength="24" autocomplete="nickname" aria-label="Your name"></label>
      <span class="muted">Everyone with this link sees this conversation.</span>
    </div>
    <section class="conversation" aria-label="Conversation">
      <div id="messages"></div>
      <p id="empty" class="empty"><span id="empty-text">Say hello, or press Talk and speak.</span></p>
    </section>
    <aside id="avatar" class="avatar-pip" aria-label="Avatar" hidden>
      <button id="avatar-close" type="button" class="avatar-close" aria-label="Hide the avatar"
              title="Hide the avatar"></button>
      <div id="avatar-face"></div>
    </aside>
    <form id="composer">
      <textarea id="prompt" rows="1" placeholder="Message…" aria-label="Message"></textarea>
      <div class="controls">
        <button id="talk" type="button" class="secondary" aria-pressed="false" hidden
                title="Talk: it listens, answers aloud, and listens again">Talk</button>
        <label class="effort" title="How much the model thinks first, for your messages">Thinking
          <select id="effort"></select>
        </label>
        <div id="tools" class="tools" hidden>
          <button id="tools-button" type="button" class="secondary" aria-haspopup="true" aria-expanded="false"
                  aria-controls="tools-menu" title="The tools the model may use here">
            <span>Tools</span><span id="tools-count" class="count"></span>
          </button>
          <div id="tools-menu" class="tools-menu" role="group" aria-label="Tools the model may use" hidden></div>
        </div>
        <span id="language" class="language" hidden title="The language this chat is assumed to be in. Type /lang to change it."></span>
        <span id="status" role="status"></span>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </main>
</body>
</html>
