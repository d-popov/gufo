<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AI Inference – Chat</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/header.css">
  <link rel="stylesheet" href="/static/chat.css">
  <script src="/static/icons.js" defer></script>
  <script src="/static/webtools.js" defer></script>
  <script src="/static/header.js" defer></script>
  <script src="/static/chat.js" defer></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="chat">
    <div class="toolbar">
      <button id="new-chat" type="button" class="secondary">New chat</button>
      <select id="history" aria-label="Recent chats"></select>
      <button id="delete-chat" type="button" class="secondary" title="Delete this chat from this browser">Delete</button>
      <div id="chat-total" class="chat-total" title="Total for this chat"></div>
    </div>
    <section class="conversation" aria-label="Conversation">
      <div id="messages"></div>
      <p id="empty" class="empty">Ask anything. Attach or paste (Ctrl+V) images up to 4 MiB each.<br>
        Enter sends, Shift+Enter adds a line. The last 10 chats are kept in this browser.</p>
    </section>
    <form id="composer">
      <div id="preview" class="preview" aria-live="polite"></div>
      <textarea id="prompt" rows="1" placeholder="Message Gufo…" aria-label="Message"></textarea>
      <div class="controls">
        <label class="button secondary attach" for="images">Attach images</label>
        <input id="images" type="file" accept="image/*" multiple hidden>
        <select id="model" required aria-label="Model"></select>
        <label class="effort">Thinking
          <select id="effort">
            <option value="">Default</option>
            <option value="none">Off</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="max">Max</option>
          </select>
        </label>
        <label class="switch" title="Let the model search the web and read pages. The requests are made by your browser, not by the server.">
          <input id="browser" type="checkbox" role="switch">
          <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          <span class="switch-text">Browser</span>
        </label>
        <span id="status" role="status"></span>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </main>
</body>
</html>
