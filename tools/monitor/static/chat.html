<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AI Inference – Chat</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/header.css">
  <link rel="stylesheet" href="/static/chat.css">
  <script src="/static/icons.js" defer></script>
  <script src="/static/librarytools.js" defer></script>
  <script src="/static/webtools.js" defer></script>
  <script src="/static/pybox.js" defer></script>
  <script src="/static/tools.js" defer></script>
  <script src="/static/header.js" defer></script>
  <script src="/static/projects.js" defer></script>
  <script src="/static/markdown.js" defer></script>
  <script src="/static/chatstore.js" defer></script>
  <script src="/static/chatsync.js" defer></script>
  <script src="/static/language.js" defer></script>
  <script src="/static/sharelink.js" defer></script>
  <script src="/static/avatar.js" defer></script>
  <script src="/static/talk.js" defer></script>
  <script src="/static/chat.js" defer></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="chat">
    <div class="toolbar">
      <select id="project" aria-label="Project"></select>
      <button id="edit-project" type="button" class="secondary" aria-expanded="false" aria-controls="project-panel"
              title="Edit this project's guidelines and memory" hidden>Project</button>
      <button id="new-chat" type="button" class="secondary">New chat</button>
      <select id="history" aria-label="Chats in this project"></select>
      <button id="delete-chat" type="button" class="secondary" title="Delete this chat from this browser">Delete</button>
      <button id="share-chat" type="button" class="secondary" aria-expanded="false" aria-controls="share-panel"
              title="Make a public link to chat, talk and listen without signing in" hidden>Share</button>
      <div id="chat-total" class="chat-total" title="Total for this chat"></div>
    </div>
    <section id="share-panel" class="project-panel" aria-label="Share this chat" hidden>
      <p class="hint">Anyone with the link can chat with this server's model, speak to it and hear it answer, without signing in,
        until the link expires, runs out of messages, or you revoke it on <a href="/shares">Shared chats</a>. They use your
        model and your voice; they get nothing else of yours.</p>
      <label class="field">Name
        <input id="share-title" type="text" maxlength="80" autocomplete="off">
      </label>
      <div class="row">
        <label class="field">Expires
          <select id="share-days"><option value="1">in 1 day</option><option value="7" selected>in 7 days</option><option value="30">in 30 days</option><option value="0">never</option></select>
        </label>
        <label class="field">Messages
          <input id="share-messages" type="number" min="1" max="10000" value="100">
        </label>
        <label class="field">Speech requests
          <input id="share-audio" type="number" min="1" max="10000" value="400">
        </label>
      </div>
      <label class="check"><input id="share-include" type="checkbox"> Start from this conversation (their copy; text only)</label>
      <div class="row">
        <button id="share-create" type="button">Make link</button>
        <button id="share-close" type="button" class="secondary">Close</button>
        <span id="share-state" role="status"></span>
      </div>
      <div id="share-result" class="row" hidden>
        <input id="share-url" type="text" readonly aria-label="The link">
        <button id="share-copy" type="button" class="secondary">Copy</button>
      </div>
    </section>
    <section id="project-panel" class="project-panel" aria-label="Project settings" hidden>
      <label class="field">Name
        <input id="project-name" type="text" maxlength="60" autocomplete="off">
      </label>
      <label class="field">Guidelines
        <span class="hint">Rules the model follows in every chat of this project, like a CLAUDE.md. Yours to write and edit.</span>
        <textarea id="project-guidelines" rows="6" maxlength="12000" spellcheck="false"></textarea>
      </label>
      <div class="row">
        <input id="project-brief" type="text" autocomplete="off" aria-label="What to draft guidelines from"
               placeholder="Describe the project or the rules you want, then draft…">
        <button id="draft-guidelines" type="button" class="secondary">Draft guidelines</button>
      </div>
      <label class="field">Memory
        <span class="hint">What the model remembers from this project's chats. It updates itself; edit it whenever you like.</span>
        <textarea id="project-memory" rows="6" maxlength="6000" spellcheck="false"></textarea>
      </label>
      <div class="row">
        <button id="update-memory" type="button" class="secondary">Update memory from this chat</button>
        <label class="check"><input id="auto-memory" type="checkbox"> Update when I leave a chat</label>
        <span id="memory-status" role="status"></span>
      </div>
      <div class="row">
        <button id="export-project" type="button" class="secondary" title="Download guidelines and memory as one Markdown file">Export .md</button>
        <label class="button secondary attach" for="import-project" title="Load a Markdown file with “# Guidelines” and “# Memory” headings">Import .md</label>
        <input id="import-project" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
        <button id="delete-project" type="button" class="secondary">Delete project</button>
        <button id="close-project" type="button">Done</button>
      </div>
    </section>
    <section class="conversation" aria-label="Conversation">
      <div id="messages"></div>
      <p id="empty" class="empty"><span id="empty-text"></span></p>
    </section>
    <aside id="avatar" class="avatar-pip" aria-label="Avatar" hidden>
      <button id="avatar-close" type="button" class="avatar-close" aria-label="Hide the avatar"
              title="Hide the avatar (turn it back on in Voice settings)"></button>
      <div id="avatar-face"></div>
    </aside>
    <form id="composer">
      <div id="steer-queue" class="steer-queue" aria-live="polite" hidden></div>
      <div id="preview" class="preview" aria-live="polite"></div>
      <textarea id="prompt" rows="1" placeholder="Message Gufo…" aria-label="Message"></textarea>
      <div class="controls">
        <label class="button secondary attach" for="images">Attach images</label>
        <input id="images" type="file" accept="image/*" multiple hidden>
        <select id="model" required aria-label="Model"></select>
        <label class="effort" title="How much the model thinks first">Thinking
          <select id="effort">
            <option value="">Default</option>
            <option value="none">Off</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="max">Max</option>
          </select>
        </label>
        <div id="tools" class="tools">
          <button id="tools-button" type="button" class="secondary" aria-haspopup="true" aria-expanded="false"
                  aria-controls="tools-menu" title="Choose the tools the model may use">
            <span>Tools</span><span id="tools-count" class="count"></span>
          </button>
          <div id="tools-menu" class="tools-menu" role="group" aria-label="Tools the model may use" hidden></div>
        </div>
        <button id="talk" type="button" class="secondary" aria-pressed="false" hidden
                title="Talk with the model: it listens, answers aloud, and listens again">Talk</button>
        <span id="language" class="language" hidden title="The language this chat is assumed to be in. Type /lang to change it."></span>
        <span id="status" role="status"></span>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
  </main>
</body>
</html>
